server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # code revalidates on every load (students always get updates) …
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # … while the chunky mascot art can be cached for a day
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
